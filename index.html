
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            background: white;
            width: 380px;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #5b4b8a;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        a {
            display: block;
            background-color: #8b5cf6;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #6d28d9;
            transform: scale(1.04);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>¡Ejercicios JavaScript!</h1>

        <p>Selecciona el ejercicio que deseas consultar.</p>

        <a href="inner.html">Inner HTML</a>

        <a href="document.html">Document.getElementById</a>

        <a href="querySelector.html">Query Selector</a>

    </div>

</body>
</html>
